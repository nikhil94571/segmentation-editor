# Fly.io settings for the hosted editor (https://<app>.fly.dev). Deploy with: fly deploy --ha=false   (one machine, not two)
app = "segmentation-tool"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # sleeps (memory snapshot) when nobody is using it; wakes on the next visit
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "1gb"                   # 2048 px images and the grow/shrink re-cut need more than the 256 MB default
  cpu_kind = "shared"
  cpus = 1
