# Fly.io settings for the hosted editor (https://<app>.fly.dev). Deploy with: fly deploy --ha=false   (one machine, not two)
app = "segmentation-tool"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # sleeps (memory snapshot) when nobody is using it; wakes on the next visit
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "2gb"
  cpu_kind = "performance"         # a dedicated CPU: a shared one is cut to ~1/12 speed after a few seconds' work,
  cpus = 1                         # which made opening a model's image ~40 s and exports minutes
